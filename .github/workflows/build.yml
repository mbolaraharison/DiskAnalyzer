name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: swift run DiskAnalyzer --selftest

      - name: Build app bundle and DMG
        run: ./bundle.sh --no-install

      - uses: actions/upload-artifact@v4
        with:
          name: DiskAnalyzer
          path: DiskAnalyzer.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DiskAnalyzer.dmg --generate-notes
